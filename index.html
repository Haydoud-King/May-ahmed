<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حيدود | متجر الألعاب والتطبيقات المهكرة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #22c55e;
            --primary-bg: #f0fdf4;
            --dark-bg: #0f172a;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-yellow: #facc15;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: var(--text-main);
            direction: rtl;
        }

        /* Header */
        header {
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            object-fit: cover;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
        }

        .search-bar {
            flex: 1;
            max-width: 450px;
            margin: 0 20px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            background-color: #f1f5f9;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            background-color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
        }

        .search-bar i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 16px;
            opacity: 0.9;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-right: 4px solid var(--primary);
            padding-right: 10px;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-img {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .card-badge {
            background-color: var(--primary-bg);
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .btn-download {
            width: 100%;
            padding: 8px 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="#" class="logo-container">
                <img src="1787488676620.png" alt="حيدود" class="logo-img">
                <span class="logo-text">حيدود</span>
            </a>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="ابحث عن تطبيق أو لعبة مهكرة...">
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>متجر حيدود للتطبيقات والألعاب المهكرة</h1>
        <p>تحميل أحدث الألعاب والتطبيقات المعدلة مجاناً وبروابط مباشرة</p>
    </section>

    <div class="container">
        <h2 class="section-title"><i class="fa-solid fa-fire text-danger"></i> أحدث الألعاب المهكرة</h2>
        <div class="grid">
            <a href="#" class="card">
                <img src="https://via.placeholder.com/80" alt="Game" class="card-img">
                <div class="card-title">Free Fire Mod</div>
                <div class="card-badge">ميجامود</div>
                <button class="btn-download">تحميل</button>
            </a>
            <a href="#" class="card">
                <img src="https://via.placeholder.com/80" alt="Game" class="card-img">
                <div class="card-title">GTA San Andreas</div>
                <div class="card-badge">أموال لا نهائية</div>
                <button class="btn-download">تحميل</button>
            </a>
            <a href="#" class="card">
                <img src="https://via.placeholder.com/80" alt="Game" class="card-img">
                <div class="card-title">Subway Surfers</div>
                <div class="card-badge">مفاتيح غير محدودة</div>
                <button class="btn-download">تحميل</button>
            </a>
            <a href="#" class="card">
                <img src="https://via.placeholder.com/80" alt="Game" class="card-img">
                <div class="card-title">PUBG Mobile</div>
                <div class="card-badge">ثبات السلاح</div>
                <button class="btn-download">تحميل</button>
            </a>
        </div>
    </div>

</body>
</html>
